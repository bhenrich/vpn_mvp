name: Python CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  python-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
      - name: Ruff (lint)
        run: |
          if compgen -G "services/*-api/app/**/*.py" > /dev/null; then
            ruff check services/*-api/app
          else
            echo "No Python service apps found, skipping."
          fi
      - name: MyPy (types)
        run: |
          if compgen -G "services/*-api/app/**/*.py" > /dev/null; then
            mypy --install-types --non-interactive services/*-api/app || true
          else
            echo "No Python service apps found, skipping."
          fi
      - name: Pytest
        run: |
          if compgen -G "services/*-api/tests/**/*.py" > /dev/null; then
            pytest -q
          else
            echo "No Python tests found, skipping."
          fi


