[package]
name = "platform-linux"
version = "0.1.0"
edition = "2021"

[dependencies]
vpn-core = { path = "../vpn-core" }
async-trait = "0.1"
tun = { version = "0.6", features = ["async"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


