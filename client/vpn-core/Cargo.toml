[package]
name = "vpn-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
eap-tls = []

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
async-trait = "0.1"
keyring = "2"
dirs-next = "2"
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"


