services:
  auth:
    build: ./auth
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
      - OVPN_REMOTE=${OVPN_REMOTE:-openvpn}
      - OVPN_PORT=${OVPN_PORT:-1194}
      - OVPN_PROTO=${OVPN_PROTO:-udp}
    ports:
      - "8080:8080"
    networks: [core]

  openvpn:
    build: ./openvpn
    cap_add:
      - NET_ADMIN
    ports:
      - "1194:1194/udp"
    environment:
      - AUTH_HOST=http://auth:8080
    volumes:
      - ./openvpn/pki:/etc/openvpn/pki:ro
      - ./openvpn/status:/etc/openvpn/status
    networks: [core]

networks:
  core:


