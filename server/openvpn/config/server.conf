port 1194
proto udp
dev tun
topology subnet
server 10.8.0.0 255.255.255.0

# PKI - provide your CA, cert, key and dh/ecdhe params in /etc/openvpn/pki
ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/server.crt
key /etc/openvpn/pki/server.key
dh /etc/openvpn/pki/dh.pem

# Authentication against external API
script-security 3
auth-user-pass-verify /etc/openvpn/scripts/verify.sh via-env
client-cert-not-required
username-as-common-name

# Crypto
cipher AES-256-GCM
auth SHA256
tls-server

# Management and status for monitoring
management 0.0.0.0 5555
status /etc/openvpn/status/status.log
status-version 2
status-interval 10

keepalive 10 60
persist-key
persist-tun
verb 3


