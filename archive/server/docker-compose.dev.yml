services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=vpn
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [core]

  auth:
    environment:
      - POSTGRES_DSN=postgres://postgres:postgres@postgres:5432/vpn?sslmode=disable
    depends_on:
      - postgres

volumes:
  pgdata:



