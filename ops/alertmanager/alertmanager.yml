global:
  resolve_timeout: 5m

route:
  receiver: 'log'
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h

receivers:
  - name: 'log'
    webhook_configs:
      - url: 'http://127.0.0.1:1'  # blackhole; visible in Alertmanager UI
        send_resolved: true

inhibit_rules:
  - source_matchers: [ severity="page" ]
    target_matchers: [ severity="ticket" ]
    equal: ['alertname', 'job']


