user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Upstreams for internal services
    upstream auth_api {
        server auth-api:8080;
    }

    upstream directory_api {
        server directory-api:8081;
    }

    upstream admin_api {
        server admin-api:8082;
    }

    server {
        listen 80;
        server_name _;

        # Auth API: /auth/ -> auth-api:8080/auth/
        location /auth/ {
            proxy_pass         http://auth_api/auth/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Directory API: /directory/ -> directory-api:8081/
        # Example: /directory/regions -> /regions on directory-api
        location /directory/ {
            proxy_pass         http://directory_api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Admin API: /admin/ -> admin-api:8082/
        location /admin/ {
            proxy_pass         http://admin_api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Simple health endpoint for the proxy itself
        location = /healthz {
            return 200 '{"status":"ok","service":"reverse-proxy"}';
            add_header Content-Type application/json;
        }
    }
}


