version: "3.9"

x-node-agent-env: &node-agent-env
  DIRECTORY_HTTP_ADDR: http://directory-api:8081
  DIRECTORY_GRPC_ADDR: http://directory-api:50051
  RUN_NFT_SETUP: "1" # Enable nftables rules for forwarding and NAT
  WG_SERVER_KEY_PATH: /var/run/vpn/server.key
  MTLS_ENABLED: "${MTLS_ENABLED:-0}"
  MTLS_CA_CERT_PATH: /certs/ca.crt
  MTLS_CLIENT_CERT_PATH: /certs/node.crt
  MTLS_CLIENT_KEY_PATH: /certs/node.key

x-node-agent-base: &node-agent-base
  build: ./nodes/agent
  network_mode: host
  cap_add:
    - NET_ADMIN
    - SYS_MODULE
  tmpfs:
    - /etc/wireguard:rw,noexec,nosuid,nodev,mode=0700
    - /var/run/vpn:rw,noexec,nosuid,nodev,mode=0700
  depends_on:
    directory-api:
      condition: service_healthy
    directory-seed:
      condition: service_completed_successfully
  volumes:
    - ./tools/pki/dev:/certs:ro
  environment:
    <<: *node-agent-env

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    ports:
      - "6379:6379"

  auth-api:
    build:
      context: .
      dockerfile: ./services/auth-api/Dockerfile
    env_file: ./services/auth-api/.env
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8080/healthz')).get('status')=='ok' else 1)"]
      interval: 5s
      retries: 10

  directory-api:
    build:
      context: .
      dockerfile: ./services/directory-api/Dockerfile
    env_file: ./services/directory-api/.env
    depends_on:
      - postgres
      - redis
      - auth-api
    ports:
      - "8081:8081"
      - "50051:50051"
    environment:
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-0}
      - GRPC_TLS_CERT_PATH=/certs/directory.crt
      - GRPC_TLS_KEY_PATH=/certs/directory.key
      - GRPC_TLS_CLIENT_CA_PATH=/certs/ca.crt
    volumes:
      - ./tools/pki/dev:/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8081/healthz')).get('status')=='ok' else 1)"]
      interval: 5s
      retries: 10

  admin-api:
    build:
      context: .
      dockerfile: ./services/admin-api/Dockerfile
    env_file: ./services/admin-api/.env
    depends_on:
      - auth-api
      - directory-api
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8082/healthz')).get('status')=='ok' else 1)"]
      interval: 5s
      retries: 10

  node-agent-de-berlin:
    <<: *node-agent-base
    environment:
      <<: *node-agent-env
      PUBLIC_ENDPOINT: de-berlin.dev.local
      NODE_REGION_CODE: DE
      NODE_REGION_CITY: Berlin
      NODE_EGRESS_IPS: 198.51.100.10
      WG_ADDRESS: 10.66.0.1/24
      WG_LISTEN_PORT: 51820

  node-agent-de-munich:
    <<: *node-agent-base
    environment:
      <<: *node-agent-env
      PUBLIC_ENDPOINT: de-munich.dev.local
      NODE_REGION_CODE: DE
      NODE_REGION_CITY: Munich
      NODE_EGRESS_IPS: 198.51.100.11
      WG_ADDRESS: 10.66.0.1/24
      WG_LISTEN_PORT: 51821

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - ./ops/runbooks:/runbooks:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - auth-api
      - directory-api
      - admin-api
      - alertmanager

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
  # Reverse proxy to expose VPN control-plane APIs on a single port
  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - auth-api
      - directory-api
      - admin-api
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"

  directory-seed:
    image: python:3.12-slim
    depends_on:
      - directory-api
    volumes:
      - ./services/directory-api/scripts:/scripts:ro
    environment:
      DIRECTORY_URL: http://directory-api:8081
    entrypoint:
      - "sh"
      - "-c"
      - "pip install --no-cache-dir requests && python /scripts/seed_regions.py"
    restart: "no"

volumes:
  pgdata:
  promdata:
  grafana-data: