services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  auth:
    build: ./server/auth
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
      - OVPN_REMOTE=${OVPN_REMOTE}
      - OVPN_PORT=${OVPN_PORT}
      - OVPN_PROTO=${OVPN_PROTO}
      - SEED_TEST_USER=true
      - TEST_USER_EMAIL=${TEST_USER_EMAIL}
      - TEST_USER_PASSWORD=${TEST_USER_PASSWORD}
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  openvpn:
    build: ./server/openvpn
    cap_add:
      - NET_ADMIN
    environment:
      - AUTH_HOST=http://auth:8080
    ports:
      - "1194:1194/udp"
    volumes:
      - openvpn-status:/etc/openvpn/status
      - ./server/openvpn/pki:/etc/openvpn/pki:ro

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  openvpn_exporter:
    image: kumina/openvpn-exporter
    command: ["--openvpn.status_paths=/status/status.log"]
    volumes:
      - openvpn-status:/status:ro
    ports:
      - "9176:9176"

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_DSN}
    ports:
      - "9187:9187"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

  node_exporter:
    image: prom/node-exporter:v1.8.1
    command:
      - '--collector.disable-defaults=false'
    ports:
      - "9100:9100"

volumes:
  pgdata:
  openvpn-status:
